<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Prevent browser auto-translate: the app is already in Hebrew.
         Without this, Chrome injects Google Translate scripts that fire
         telemetry calls to gstatic.com — blocked by ad-blockers, causing
         ERR_BLOCKED_BY_CLIENT noise in the console. -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="BUILD PLAY - עמדת עריכת פלייליסטים מקצועית להתקנה על מובייל."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BUILD PLAY" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BUILD PLAY" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>BUILD PLAY</title>
    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#111827" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
