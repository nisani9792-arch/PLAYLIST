<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Prevent browser auto-translate: the app is already in Hebrew.
         Without this, Chrome injects Google Translate scripts that fire
         telemetry calls to gstatic.com — blocked by ad-blockers, causing
         ERR_BLOCKED_BY_CLIENT noise in the console. -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="JUSIC PLAY - עמדת בניית פלייליסטים חכמה למוזיקה חרדית."
    />
    <meta property="og:title" content="JUSIC PLAY" />
    <meta property="og:image" content="%BASE_URL%opengraph.jpg" />
    <meta property="og:type" content="website" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="JUSIC PLAY" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JUSIC PLAY" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>JUSIC PLAY</title>
    <!-- Favicon & PWA — JUSIC PLAY (bump v when replacing icons) -->
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icon-512.png?v=9" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=9" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png?v=9" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=9" />
    <link rel="manifest" href="%BASE_URL%manifest.json?v=9" />
    <meta name="theme-color" content="#F4F6FC" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
