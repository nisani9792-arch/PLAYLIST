<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Prevent browser auto-translate: the app is already in Hebrew.
         Without this, Chrome injects Google Translate scripts that fire
         telemetry calls to gstatic.com — blocked by ad-blockers, causing
         ERR_BLOCKED_BY_CLIENT noise in the console. -->
    <meta name="google" content="notranslate" />
    <title>JUSIC MANEGE PRO</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
