<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Prevent browser auto-translate: the app is already in Hebrew.
         Without this, Chrome injects Google Translate scripts that fire
         telemetry calls to gstatic.com — blocked by ad-blockers, causing
         ERR_BLOCKED_BY_CLIENT noise in the console. -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="BUILD PLAY - עמדת עריכת פלייליסטים מקצועית להתקנה על מובייל."
    />
    <meta property="og:title" content="BUILD PLAY" />
    <meta property="og:image" content="%BASE_URL%opengraph.jpg" />
    <meta property="og:type" content="website" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BUILD PLAY" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BUILD PLAY" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>BUILD PLAY</title>
    <!-- Favicon & PWA — BUILD PLAY (v=5 cache bust) -->
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icon-512.png?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=5" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#121212" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
