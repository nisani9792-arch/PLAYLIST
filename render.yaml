# Repo root must be the service root: this monorepo needs root package.json + pnpm-workspace.yaml.
# Do NOT set Root Directory to "artifacts" (no package.json there) — only subtrees like artifacts/api-server have one.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: workspace-api
    runtime: node
    rootDir: "."
    buildCommand: bash scripts/render-build.sh
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "22"
